function renderFound(project){const f=document.createDocumentFragment();for(const sq of level.solutions){if(!found.has(sq.id))continue;
 // Re-orient edge list from an arbitrary cube corner by finding actual edge length.
 const ps=sq.points,side=Math.min(...ps.flatMap((p,i)=>ps.slice(i+1).map(q=>len2(sub(p,q)))));
 const mids=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++)if(len2(sub(ps[i],ps[j]))===side)mids.push([ps[i],ps[j]]);
 // Faces are represented by four mutually coplanar corners with square edge length.
 const faceSets=new Set(),faces=[];
 for(let i=0;i<8;i++)for(let j=i+1;j<8;j++)for(let k=j+1;k<8;k++)for(let l=k+1;l<8;l++){
  const group=[ps[i],ps[j],ps[k],ps[l]],dists=[];for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)dists.push(len2(sub(group[a],group[b])));dists.sort((a,b)=>a-b);if(dists[0]===side&&dists[3]===side&&dists[4]===side*2&&dists[5]===side*2){let c=group.reduce((t,p)=>add(t,p),[0,0,0]).map(x=>x/4);group.sort((p,q)=>{const aa=sub(p,c),bb=sub(q,c);const u=sub(group[0],c),v=sub(group[1],c);return 0});faces.push(group);}
 }
 // Found cubes stay as subtle wireframes. Filled faces are not needed to understand them.
 for(const [a,b] of mids)f.append(line(project(a),project(b),'found-edge'));
 }
 $('foundLayer').replaceChildren(f);
}
function renderSelection(project){const f=document.createDocumentFragment();const ps=selected.map(k=>level.points.find(p=>key(p)===k));
 const P=ps.map(project);
 if(ps.length>=2)f.append(line(P[0],P[1],'selection-line'));
 if(ps.length>=3){const d=add(ps[1],sub(ps[2],ps[0]));f.append(polygon([project(ps[0]),project(ps[1]),project(d),project(ps[2])],'selection-face'));}
 if(previewMissing){const {pts}=previewMissing;for(const [a,b]of E)f.append(line(project(pts[a]),project(pts[b]),'ghost-wire'));for(const p of previewMissing.missing)f.append(circle(project(p),7,'missing'));}
 for(const p of ps){const q=project(p);f.append(circle(q,10,'selected-halo'));f.append(circle(q,7.2,'selected-ring'));}
 if(hint){const p=level.points.find(p=>key(p)===hint);if(p){const q=project(p);f.append(circle(q,12.5,'selected-ring',{stroke:'#b8965f','stroke-dasharray':'2 4'}));}}
 $('previewLayer').replaceChildren(f);
}
function renderDots(){const f=document.createDocumentFragment();const pts=[...level.points].sort((a,b)=>projection.get(key(a)).z-projection.get(key(b)).z);
 for(const p of pts){const k=key(p),q=projection.get(k),d=degree.get(k),usedN=used.get(k)||0,r=clamp(4.1*q.fac,3.15,6.7);f.append(circle(q,r+2.4,'dot-shadow'));f.append(circle(q,r,'dot '+(usedN>=d?'exhausted':d>1?'multi':'single')+(selected.includes(k)?' selected':'')));}
 $('dotLayer').replaceChildren(f);
}
function renderFlash(project){const layer=$('effectLayer');if(!flash){layer.replaceChildren();return;}const f=document.createDocumentFragment(),ps=flash.points,side=Math.min(...ps.flatMap((p,i)=>ps.slice(i+1).map(q=>len2(sub(p,q)))));for(let i=0;i<8;i++)for(let j=i+1;j<8;j++)if(len2(sub(ps[i],ps[j]))===side)f.append(line(project(ps[i]),project(ps[j]),'cube-flash',{pathLength:100}));layer.replaceChildren(f)}
function render(){raf=0;if(!level)return;const project=pointsProjection();drawGrid(project);renderFound(project);renderSelection(project);renderDots();renderFlash(project)}
const schedule=()=>{if(!raf)raf=requestAnimationFrame(render)};
const statusMessages=['TAP A CORNER POINT','TAP AN EDGE POINT','FIND A RIGHT ANGLE','ADD THE THIRD EDGE'];
function updateInstruction(){const i=Math.min(selected.length,3);$('instruction').textContent=statusMessages[i];const seq=[...$('sequence').children];seq.forEach((e,n)=>e.classList.toggle('active',n<selected.length));$('undo').disabled=selected.length===0;}
function refresh(){const cleared=[...degree].filter(([k,n])=>(used.get(k)||0)>=n).length;const done=cleared===level.points.length;
 $('foundCount').textContent=found.size;$('pointsProgress').textContent=`${cleared} / ${level.points.length}`;$('progressBar').style.width=`${cleared/level.points.length*100}%`;
 $('completeNum').textContent=String(stage+1).padStart(2,'0');$('completeSub').textContent=`${found.size} CUBE${found.size===1?'':'S'} DISCOVERED`;$('next').textContent=stage===LEVELS.length-1?'STAGE 01 ›':'NEXT ›';
 if(done){saved.done[String(stage)]=[...found];persist();clearTimeout(completionTimeout);completionTimeout=setTimeout(()=>{if(stage===level.number-1){$('completion').hidden=false;requestAnimationFrame(()=>$('completion').classList.add('show'));}},420)}
 else{$('completion').hidden=true;$('completion').classList.remove('show')}
 updateInstruction();updatePicker();schedule();
}
let toastTimeout=null;function message(t){const d=$('toast');d.textContent=t;d.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>d.classList.remove('show'),1200)}
function resetSelection(){selected=[];previewMissing=null;clearTimeout(previewTimeout);updateInstruction();schedule()}
function isPerpEqual(a,b){return len2(a)===len2(b)&&dot(a,b)===0&&len2(a)>0}
function enterPoint(p){if(!p||($('completion').hidden===false))return;const k=key(p);if(selected.includes(k)){const at=selected.indexOf(k);selected=selected.slice(0,at+1);message('SELECT A DIFFERENT POINT');sound('tap');updateInstruction();schedule();return;}
 if(selected.length===0){selected=[k];hint=null;sound('tap');updateInstruction();schedule();return;}
 if(selected.length===1){selected.push(k);sound('tap');updateInstruction();schedule();return;}
 const origin=level.points.find(q=>key(q)===selected[0]);const first=level.points.find(q=>key(q)===selected[1]);const a=sub(first,origin),b=sub(p,origin);
 if(selected.length===2){if(!isPerpEqual(a,b)||!level.points.some(q=>key(q)===key(add(first,b)))){message('FIND A SQUARE FACE');sound('error');return;}selected.push(k);sound('step');updateInstruction();schedule();return;}
 const second=level.points.find(q=>key(q)===selected[2]),c=sub(second,origin);
 if(!isPerpEqual(a,b)||!isPerpEqual(c,b)){message('THREE RIGHT ANGLES');sound('error');return;}
 const pts=cubePts(origin,[a,c,b]),id=canonical(pts),existing=level.solutions.find(s=>s.id===id);
 if(found.has(id)){message('ALREADY DISCOVERED');resetSelection();sound('tap');return;}
 if(existing){found.add(id);for(const v of existing.points)used.set(key(v),(used.get(key(v))||0)+1);flash=existing;clearTimeout(flashTimeout);flashTimeout=setTimeout(()=>{flash=null;schedule()},480);sound(found.size===level.solutions.length?'finish':'found');resetSelection();refresh();message('CUBE FOUND!');}
 else{const available=new Set(level.points.map(key)),missing=pts.filter(q=>!available.has(key(q)));previewMissing={pts,missing};clearTimeout(previewTimeout);previewTimeout=setTimeout(()=>{previewMissing=null;schedule()},950);message('SOME CORNERS ARE MISSING');sound('error');schedule();}
}
function pickPoint(q){let best=null,dmin=Infinity;for(const p of level.points){const s=projection.get(key(p)),d=Math.hypot(s.x-q.x,s.y-q.y);if(d<dmin){dmin=d;best=p}}return dmin<=clamp(14+4*zoom,14,21)?best:null}
function undo(){if(selected.length){selected.pop();previewMissing=null;hint=null;updateInstruction();schedule();sound('tap')}}
function hintPoint(){const remaining=level.solutions.find(s=>!found.has(s.id));if(!remaining)return;const candidates=remaining.points.filter(p=>degree.get(key(p))===1),list=candidates.length?candidates:remaining.points;hint=key(list[0]);message('START FROM THIS POINT');schedule();setTimeout(()=>{hint=null;schedule()},2000)}
function updatePicker(){if(!level)return;const p=$('picker');p.replaceChildren();for(let i=0;i<LEVELS.length;i++){const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.className=(i===stage?'active ':'')+(Array.isArray(saved.done[String(i)])?'completed':'');b.addEventListener('click',()=>{load(i);p.hidden=true;$('selectStage').setAttribute('aria-expanded','false')});p.append(b)}}
function load(i){clearTimeout(completionTimeout);clearTimeout(flashTimeout);clearTimeout(previewTimeout);stage=(i+LEVELS.length)%LEVELS.length;level=LEVELS[stage];selected=[];previewMissing=null;flash=null;hint=null;found=new Set();degree=level.degree;used=new Map(level.points.map(p=>[key(p),0]));
 const ids=new Set(level.solutions.map(s=>s.id));for(const id of saved.done[String(stage)]||[])if(ids.has(id))found.add(id);
 for(const s of level.solutions)if(found.has(s.id))for(const p of s.points)used.set(key(p),(used.get(key(p))||0)+1);
 const mins=[0,1,2].map(j=>Math.min(...level.points.map(p=>p[j]))),maxs=[0,1,2].map(j=>Math.max(...level.points.map(p=>p[j])));sceneCenter=mins.map((v,j)=>(v+maxs[j])/2);radius=Math.max(...level.points.map(p=>Math.sqrt(len2(sub(p,sceneCenter)))));unit=clamp(150/(radius*1.26),11,80);zoom=1;yaw=.66+(stage%4)*.21;pitch=-.34-(stage%3)*.13;
 $('stageNum').textContent=String(stage+1).padStart(2,'0');$('subtitle').textContent=level.title;$('completion').hidden=true;$('completion').classList.remove('show');$('picker').hidden=true;$('selectStage').setAttribute('aria-expanded','false');saved.stage=stage;persist();refresh();}
$('previous').addEventListener('click',()=>load(stage-1));$('advance').addEventListener('click',()=>load(stage+1));$('selectStage').addEventListener('click',()=>{$('picker').hidden=!$('picker').hidden;$('selectStage').setAttribute('aria-expanded',String(!$('picker').hidden))});$('undo').addEventListener('click',undo);$('hint').addEventListener('click',hintPoint);$('sound').addEventListener('click',()=>{saved.sound=!saved.sound;$('sound').textContent=saved.sound?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',String(saved.sound));persist();if(saved.sound)sound('tap')});$('replay').addEventListener('click',()=>{delete saved.done[String(stage)];persist();load(stage)});$('next').addEventListener('click',()=>{load(stage+1);window.scrollTo(0,0)});
const canvas=$('canvas');function coord(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*360/r.width,y:(e.clientY-r.top)*440/r.height,px:e.clientX,py:e.clientY}}
function startPinch(){const a=[...pointers.values()];if(a.length<2)return;pinch={dist:Math.hypot(a[0].px-a[1].px,a[0].py-a[1].py),zoom};drag=null}
canvas.addEventListener('pointerdown',e=>{if(!pointers.size&&(!$('completion').hidden))return;e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){ }const p=coord(e);pointers.set(e.pointerId,p);if(pointers.size===1){drag={id:e.pointerId,p,old:p,moved:false,when:performance.now()}}else startPinch();},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const p=coord(e),previous=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size>=2){const a=[...pointers.values()];if(!pinch)startPinch();const d=Math.hypot(a[0].px-a[1].px,a[0].py-a[1].py);if(pinch&&pinch.dist>0)zoom=clamp(pinch.zoom*d/pinch.dist,.6,2.3);schedule();return;}if(!drag)return;const dx=p.px-previous.px,dy=p.py-previous.py;if(Math.hypot(p.px-drag.p.px,p.py-drag.p.py)>7)drag.moved=true;if(drag.moved){yaw+=dx*.009;pitch=clamp(pitch-dy*.008,-1.5,1.5);schedule()}},{passive:false});
function pointerUp(e,cancel=false){if(!pointers.has(e.pointerId))return;e.preventDefault();const p=coord(e),wasDrag=drag,pn=pointers.size;pointers.delete(e.pointerId);if(pn===1&&wasDrag&&!cancel&&!wasDrag.moved&&performance.now()-wasDrag.when<700){const point=pickPoint(p);if(point)enterPoint(point)}if(pointers.size===1){const[a,b]=[...pointers.entries()][0];drag={id:a,p:b,old:b,moved:true,when:performance.now()};pinch=null;}else{drag=null;pinch=null;}schedule()}
canvas.addEventListener('pointerup',e=>pointerUp(e),{passive:false});canvas.addEventListener('pointercancel',e=>pointerUp(e,true),{passive:false});canvas.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId))pointerUp(e,true)});canvas.addEventListener('contextmenu',e=>e.preventDefault());
for(const evt of ['gesturestart','gesturechange','gestureend'])document.addEventListener(evt,e=>{if($('boardWrap').contains(e.target)&&e.cancelable)e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')undo();if(e.key==='ArrowLeft')load(stage-1);if(e.key==='ArrowRight')load(stage+1)});
$('sound').textContent=saved.sound?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',String(saved.sound));
// Developer-only non-mutating state inspection and exhaustive deterministic cube verification.
window.__CUBE_SNAP_TEST__={summary:()=>LEVELS.map((l,i)=>({stage:i+1,dots:l.points.length,cubes:l.solutions.length,allPointsUsed:[...l.degree.values()].every(n=>n>0)})),state:()=>({stage:stage+1,points:level.points.length,solutions:level.solutions.length,found:found.size,selected:selected.length,won:found.size===level.solutions.length}),load,solveCurrent:()=>{for(const cube of level.solutions){if(!found.has(cube.id)){found.add(cube.id);for(const p of cube.points)used.set(key(p),(used.get(key(p))||0)+1)}}refresh();return found.size}};
load(Number.isInteger(saved.stage)?saved.stage:0);
})();
