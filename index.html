function stages(){const maxUnlock=Math.min(LEVELS.length-1,Math.max(0,...finished)+1);openSheet('すなの みち',`<p>ひかっている ところは、いつでも あそびなおせるよ。</p><div class="stage-grid">${LEVELS.map((p,i)=>`<button class="stage-dot ${finished.includes(i)?'clear':''} ${current===i?'now':''}" data-stage="${i}" ${i>maxUnlock?'disabled':''} aria-label="ステージ ${i+1}"></button>`).join('')}</div><button id="goBack" class="sheet-action">もどる</button>`);$$('[data-stage]').forEach(x=>x.addEventListener('click',()=>{mode='puzzle';setStage(Number(x.dataset.stage));closeSheet()}));$('#goBack').addEventListener('click',menu)}
$('#mainBtn').addEventListener('click',action);$('#hintBtn').addEventListener('click',hint);$('#flowBtn').addEventListener('click',toggleMode);$('#menuBtn').addEventListener('click',menu);$('#soundBtn').addEventListener('click',()=>{muted=!muted;storagePut(lsVer+'-mute',muted);render(false);if(!muted)tone('swap')});$('#sheetClose').addEventListener('click',closeSheet);els.sheet.addEventListener('click',e=>{if(e.target===els.sheet)closeSheet()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
setStage(current);
</script></body></html>
