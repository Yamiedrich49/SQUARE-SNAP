<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f8f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SQUARE SNAP — v8.2 / RETICLE</title>
<style>
:root{color-scheme:light;--paper:#fff;--bg:#f5f8f7;--ink:#293f46;--muted:#83979c;--cyan:#0c9ba4;--cyan-deep:#087f88;--grid:#e8efef;--silk:#d8e6e5;--gold:#c79b65}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button{border:0;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #74bec2;outline-offset:3px}
[hidden]{display:none!important}
.shell{width:min(100%,486px);margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px max(18px,env(safe-area-inset-bottom,0px));}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 13px}
.wordmark{display:flex;align-items:center;gap:9px;letter-spacing:.15em;font-size:12px;font-weight:850}
.brandmark{width:17px;height:17px;border:2px solid #119ba4;border-radius:3px;transform:rotate(-17deg);position:relative;box-shadow:4px -3px 0 -1px var(--bg),4px -3px 0 0 #a6d9d7}
.brandver{font-size:9px;color:#a2b0b2;letter-spacing:.15em;font-weight:750}
.pager{display:grid;grid-template-columns:45px 1fr 45px;gap:8px;margin-bottom:10px}
.pager button{height:43px;background:white;border:1px solid #e3ecea;border-radius:13px;box-shadow:0 2px 8px #355b5908}
.pager button:not(.choose){font-size:20px;color:#7a9698;font-weight:500}
.pager button:active{background:#eaf5f4;transform:scale(.985)}
.pager .choose{font-size:11px;letter-spacing:.12em;font-weight:780;color:#3f737b}
.pager .choose span{font-size:11px;font-weight:700;color:#a3b3b5;letter-spacing:0}
.picker{padding:12px;background:white;border:1px solid #e1eceb;border-radius:15px;margin-bottom:11px;box-shadow:0 8px 28px #2c55530b}
.pickerhead{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:690;margin:0 3px 9px}
.stagegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.stagebtn{height:38px;background:#f8faf9;border:1px solid #e7eeee;border-radius:9px;font-size:11px;font-weight:780;color:#819398;position:relative}
.stagebtn.current{border-color:#14a0a9;box-shadow:inset 0 0 0 1px #14a0a9;color:#078990}
.stagebtn.done{background:#e9f5f2;color:#168e8c;border-color:#cfe8e1}
.stagebtn.done:after{content:'✓';position:absolute;top:1px;right:3px;font-size:8px}
.stagebtn.partial{color:#288d93;background:#f0f9f8}
.paper{background:var(--paper);border:1px solid #e5eeed;border-radius:23px;padding:0 8px 10px;box-shadow:0 14px 44px #244c4e0b;overflow:hidden}
.dashboard{padding:18px 13px 12px}
.dashboardtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:9.5px;font-weight:750;letter-spacing:.15em;color:#8da5a8}
.dashboardtitle{font-size:14px;font-weight:780;letter-spacing:-.025em;margin:5px 0 0}
.foundcount{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.foundcount strong{font-size:33px;font-weight:750;letter-spacing:-.06em;color:var(--cyan-deep);font-variant-numeric:tabular-nums}
.foundcount span{font-size:10px;color:#89a0a3;font-weight:700}
.smallprogress{margin-top:12px;display:flex;justify-content:space-between;font-size:10px;font-weight:650;color:#96a8aa}
.smallprogress strong{color:#729499;font-weight:780;font-variant-numeric:tabular-nums}
.progress-track{height:3px;background:#e9f1f0;border-radius:3px;overflow:hidden;margin-top:7px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#8ad1ca,#129faa);border-radius:3px;transition:width .32s cubic-bezier(.2,.7,.15,1)}
.boardwrap{position:relative;touch-action:none;overscroll-behavior:contain;border-radius:15px;overflow:hidden;background:#fcfefd;border:1px solid #ebf0f0;isolation:isolate;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.boardwrap svg{width:100%;height:auto;display:block;aspect-ratio:360/482;touch-action:none;user-select:none;-webkit-user-select:none}
.boardwrap svg *{touch-action:none;user-select:none;-webkit-user-select:none}
#input{pointer-events:all}
.grid-major{stroke:#dce9e8;stroke-width:.92}.grid-minor{stroke:#e9f0ef;stroke-width:.75}
.completed-square{fill-opacity:.075;stroke-width:1.8;stroke-opacity:.70;stroke-linejoin:round;pointer-events:none}
.completed-square.is-giant{fill-opacity:.065;stroke-width:2.1;stroke-opacity:.78}
.completed-square.fresh{animation:foundfill .50s ease-out both}
#foundLayer.celebrate{animation:completionShimmer .94s ease-out both}
.stamp{fill:#16a6ad;fill-opacity:.055;stroke:#16a4ac;stroke-width:2.1;stroke-dasharray:5.2 4.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;vector-effect:non-scaling-stroke}
.stamp.ready{fill:#17b3a7;fill-opacity:.13;stroke:#0cab9e;stroke-width:2.65;stroke-dasharray:none;filter:drop-shadow(0 0 4px #40c2b247)}
.dot{stroke:#fff;stroke-width:1.35;transition:fill .27s ease,opacity .27s ease}
.dot.single{fill:#2e454e}.dot.multi{fill:#0a9da6}.dot.exhausted{fill:#bbcacc;opacity:.83}
.vertex-glow{fill:none;stroke:#69d2c4;stroke-width:2.4;opacity:0}
.vertex-glow.on{opacity:.68}
.hint-ring{fill:none;stroke:#c69c65;stroke-width:2.5;stroke-dasharray:2 5;animation:hint 1.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.trace{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:drawline .40s cubic-bezier(.22,.74,.19,1) both}
.halo{fill:none;stroke-width:1.8;animation:softHalo .53s ease-out both;transform-box:fill-box;transform-origin:center}
#toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-5px);background:#23474bcf;color:#fff;border-radius:99px;padding:8px 15px;font-size:11px;letter-spacing:.02em;font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap;box-shadow:0 7px 21px #294b4b1b}
#toast.show{opacity:1;transform:translate(-50%,0)}
.legendbar{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:41px;padding:6px 13px 0}
.legend{display:flex;align-items:center;gap:13px;color:#657c83;font-size:10px;font-weight:680}
.legenditem{display:flex;align-items:center;gap:6px;white-space:nowrap}
.mini-dot{width:11px;height:11px;border-radius:50%;background:#2e454e;display:inline-block}
.mini-dot.multi{background:#0a9da6}
.controls{display:flex;align-items:center;gap:6px}
.control{min-height:34px;padding:6px 10px;border:1px solid #e6eeed;border-radius:10px;background:#f9fbfa;font-size:11px;font-weight:720;color:#638087}
.control:active{transform:scale(.97);background:#eaf5f3}
.control.ellipsis{width:36px;font-size:18px;line-height:1;padding:6px}
.guide{font-size:10px;text-align:center;color:#a1b1b2;letter-spacing:.025em;margin:12px 0 3px;font-weight:570}
.options{display:flex;gap:8px;justify-content:space-between;margin:9px 3px 0;padding:10px;background:#f8fbfa;border:1px solid #eaf0ef;border-radius:12px}
.options button{flex:1;min-height:38px;background:white;border:1px solid #e3eeec;border-radius:9px;font-size:11px;font-weight:740;color:#5a777e}
.win{display:none;align-items:center;justify-content:space-between;gap:10px;padding:13px;margin:10px 2px 0;background:linear-gradient(115deg,#f1faf8,#fdfcfa);border:1px solid #cfe9e3;border-radius:13px}
.win.show{display:flex}
.win strong{font-size:13px;color:#168c8d}.win span{display:block;font-size:10px;color:#859da1;margin-top:3px}
.win button{background:#0e989f;color:white;border-radius:10px;padding:11px 12px;white-space:nowrap;font-size:11px;font-weight:780}
@keyframes completionShimmer{0%{filter:none}23%{filter:drop-shadow(0 0 4px #7bcec77a) brightness(1.18)}100%{filter:none}}
@keyframes drawline{to{stroke-dashoffset:0}}
@keyframes foundfill{from{fill-opacity:0;stroke-opacity:0}to{fill-opacity:.075;stroke-opacity:.70}}
@keyframes softHalo{from{opacity:.58;transform:scale(.2)}to{opacity:0;transform:scale(2.5)}}
@keyframes hint{0%,100%{opacity:.5;transform:scale(.93)}50%{opacity:1;transform:scale(1.12)}}
@media(max-width:370px){.shell{padding-left:8px;padding-right:8px}.paper{padding-left:5px;padding-right:5px}.dashboard{padding-left:10px;padding-right:10px}.legendbar{padding-left:8px;padding-right:8px}.legend{gap:8px;font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.low-motion *,body.low-motion *::before,body.low-motion *::after{animation:none!important;transition:none!important}

/* CRISP EDITION / linework, not decoration. Geometry is the ornament. */
:root{--bg:#f7f9f8;--ink:#263d45;--muted:#8da1a5;--cyan:#0d969c;--cyan-deep:#0a7f86;--grid:#e9efed;--gold:#b59668}
.shell{max-width:476px}
.brandmark{border-radius:1px;transform:rotate(-11deg);box-shadow:3px -3px 0 -1px var(--bg),3px -3px 0 0 #c1e0dd}
.brandver{letter-spacing:.13em;font-size:9px;color:#9aaeb0}
.paper{border-radius:20px;box-shadow:0 10px 35px #264e4d09;border-color:#e6eeec}
.boardwrap{border-color:#ecf0ee;background:#fdfefd;border-radius:11px}
.grid-major{stroke:#dce7e5;stroke-width:.76}
.grid-minor{stroke:#edf2f0;stroke-width:.72}
.precision-point{transition:opacity .16s linear;pointer-events:none}
.precision-point .pin-core{fill:#29434a;stroke:none;vector-effect:non-scaling-stroke}
.precision-point .pin-outline{fill:none;stroke:#c7d8d8;stroke-width:.7;opacity:.56;vector-effect:non-scaling-stroke}
.precision-point.multi .pin-core{fill:#0a9399}
.precision-point.multi .pin-outline{stroke:#0d969c;stroke-width:1.3;opacity:.80}
.precision-point.exhausted .pin-core{fill:#c0cccb}
.precision-point.exhausted .pin-outline{stroke:#d3dedd;opacity:.42}
.stamp{fill:#139a9f;fill-opacity:.024;stroke:#12959e;stroke-width:1.6;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;filter:none;vector-effect:non-scaling-stroke}
.stamp.locked{stroke:#087f85;stroke-width:1.95;fill-opacity:.040}
.stamp.ready{stroke:#0a858a;stroke-width:2.15;stroke-dasharray:none;fill:#0d999f;fill-opacity:.058;filter:none}
.completed-square{fill-opacity:.046;stroke-width:1.45;stroke-opacity:.73;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.completed-square.is-giant{fill-opacity:.038;stroke-width:1.85;stroke-opacity:.83}
.completed-square.fresh{animation:crispFill .20s ease-out both}
.trace{fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:100;stroke-dashoffset:100;animation:fastTrace .17s cubic-bezier(.07,.75,.24,1) both;vector-effect:non-scaling-stroke}
.trace-shine{fill:none;stroke:#ffffff!important;stroke-width:.9;stroke-linejoin:miter;stroke-dasharray:100;stroke-dashoffset:100;animation:fastTrace .145s cubic-bezier(.07,.8,.25,1) 15ms both;vector-effect:non-scaling-stroke}
#glowsLayer{display:none}
#toast{box-shadow:none;font-weight:500}
.mini-dot{width:9px;height:9px;background:#29434a;box-shadow:0 0 0 2px #e0e9e7}
.mini-dot.multi{background:#0a9399;box-shadow:0 0 0 2px #bfe0dc}
.foundcount strong{font-size:30px;font-weight:640;letter-spacing:-.05em}
.foundcount span{font-size:8px;letter-spacing:.11em;font-weight:760}
.dashboardtitle{font-weight:710}
.progress-fill{transition:width .20s ease-out;background:#11999c}
@keyframes fastTrace{to{stroke-dashoffset:0}}
@keyframes crispFill{from{fill-opacity:0;stroke-opacity:0}to{fill-opacity:.046;stroke-opacity:.73}}

/* 8.1: The grid is one quiet plane; vertices are single, stable marks. */
:root{--bg:#f7f9f8;--ink:#293e43;--cyan:#0c9299;--cyan-deep:#0a8188}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.brandbar{padding-bottom:11px;padding-left:7px;padding-right:7px}
.wordmark{font-size:11px;letter-spacing:.165em;font-weight:780}
.brandmark{width:15px;height:15px;border-width:1.5px;box-shadow:3px -2px 0 -1px var(--bg),3px -2px 0 0 #b8dedb}
.pager{margin-bottom:9px}
.paper{border:1px solid #e6eeec;border-radius:18px;box-shadow:0 7px 28px #264e4d06}
.dashboard{padding:15px 13px 12px}
.eyebrow{font-size:10px;letter-spacing:.13em;color:#7c9295}
.foundcount strong{font-size:27px}
.foundcount span{font-size:8px;letter-spacing:.13em}
.smallprogress{margin-top:9px;color:#98abae;font-size:10px}
.progress-track{margin-top:6px;height:2px}
.boardwrap{border:1px solid #eaf0ed;background:#fdfefd;border-radius:9px}
.grid-line{fill:none;stroke:#e6eeeb;stroke-width:.8;vector-effect:non-scaling-stroke}
.precision-point{transition:opacity .16s linear;pointer-events:none}
.precision-point .pin-core{fill:#30474c;stroke:none;vector-effect:non-scaling-stroke}
.precision-point.multi .pin-core{fill:#0b979b}
.precision-point.exhausted .pin-core{fill:#c4d0ce}
.mini-dot{width:9px;height:9px;box-shadow:none;background:#30474c}
.mini-dot.multi{box-shadow:none;background:#0b979b}
.completed-square{fill-opacity:.05;stroke-opacity:.73}
.completed-square.fresh{animation:none}
.stamp.ready{fill-opacity:.058}
.trace{fill:none;stroke-width:2.9;stroke-linejoin:miter;stroke-linecap:butt;stroke-dasharray:100;stroke-dashoffset:100;animation:precisionTrace .21s cubic-bezier(.12,.72,.26,1) both;vector-effect:non-scaling-stroke}
.trace-sweep{fill:none;stroke-width:4.1;stroke:#4bbeb6;stroke-linejoin:miter;stroke-linecap:butt;stroke-dasharray:11 89;stroke-dashoffset:112;animation:precisionSweep .235s cubic-bezier(.23,.43,.4,1) both;vector-effect:non-scaling-stroke}
.trace-corners{fill:none;stroke:#108e91;stroke-width:1.5;stroke-linecap:butt;opacity:0;animation:cornerFlash .15s ease-out .12s both;vector-effect:non-scaling-stroke}
.legendbar{padding-top:5px;min-height:39px}
.legend{font-weight:600;font-size:10px;gap:14px}
.control{background:transparent;border-color:#e8eeec}
.guide{margin:9px 0 0;color:#9cafae}
#toast{font-size:10px;box-shadow:none}
@keyframes precisionTrace{0%{stroke-dashoffset:100;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes precisionSweep{0%{stroke-dashoffset:112;opacity:0}12%{opacity:1}87%{opacity:.96}100%{stroke-dashoffset:0;opacity:0}}
@keyframes cornerFlash{0%{opacity:0}28%{opacity:.85}100%{opacity:0}}
/* v8.2 — Four tiny, optical-only drafting corner marks. No drag handles. */
.reticle{opacity:.64;pointer-events:none;transition:opacity 85ms linear}
.reticle-mark{fill:none;stroke:#168e96;stroke-width:1.15;stroke-linecap:square;stroke-linejoin:miter;vector-effect:non-scaling-stroke}
.reticle.is-moving{opacity:.82}
.reticle.is-locked{opacity:.97}
.reticle.is-ready .reticle-mark{stroke:#087f85;stroke-width:1.4}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.options button{min-width:0}
</style>
</head>
<body>
<main class="shell">
<header class="brandbar"><div class="wordmark"><span class="brandmark" aria-hidden="true"></span>SQUARE SNAP</div></header>
<nav class="pager" aria-label="ステージ切り替え"><button id="prev" aria-label="前の問題" type="button">‹</button><button id="choose" class="choose" type="button" aria-expanded="false">STAGE <b id="stageIdx">01</b> <span>/ 30 ⌄</span></button><button id="nextStage" aria-label="次の問題" type="button">›</button></nav>
<section id="picker" class="picker" hidden><div class="pickerhead"><span>STAGE SELECT</span><span>✓ クリア済み</span></div><div class="stagegrid" id="stageGrid"></div></section>
<section class="paper" aria-label="隠れた正方形パズル">
  <header class="dashboard"><div class="dashboardtop"><div><h1 class="sr-only">隠れた正方形</h1><div class="eyebrow" id="stageText">28 POINTS</div></div><div class="foundcount"><strong id="score">0</strong><span>SQUARES</span></div></div><div class="smallprogress"><span>使い切った点</span><strong id="fulfilled">0 / 28</strong></div><div class="progress-track"><div id="fulfillBar" class="progress-fill"></div></div></header>
  <div class="boardwrap" id="wrap">
    <svg id="board" viewBox="0 0 360 482" aria-label="1本指で正方形を移動、2本指で拡大と回転をするパズル">
      <rect width="360" height="482" fill="#fcfefd"/>
      <g id="lattice" pointer-events="none"></g>
      <g id="foundLayer" pointer-events="none"></g>
      <g id="stampLayer" pointer-events="none"><polygon id="stamp" class="stamp" points=""/><g id="reticle" class="reticle" aria-hidden="true"><path class="reticle-mark"/><path class="reticle-mark"/><path class="reticle-mark"/><path class="reticle-mark"/></g></g>
      <g id="dotsLayer" pointer-events="none"></g>
      <g id="glowsLayer" pointer-events="none"></g>
      <g id="hintLayer" pointer-events="none"></g>
      <g id="effectsLayer" pointer-events="none"></g>
      <rect id="input" x="0" y="0" width="360" height="482" fill="transparent"/>
    </svg>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="legendbar"><div class="legend"><span class="legenditem"><i class="mini-dot"></i>1回だけ</span><span class="legenditem"><i class="mini-dot multi"></i>2回以上</span></div><div class="controls"><button id="hint" class="control" type="button">ヒント</button><button id="settings" class="control ellipsis" type="button" aria-label="設定" aria-expanded="false">···</button></div></div>
  <div class="options" id="options" hidden><button type="button" id="sound" aria-pressed="true">音 ON</button><button type="button" id="motion" aria-pressed="false">動き ON</button><button type="button" id="reticleToggle" aria-pressed="true">四隅 ON</button><button type="button" id="reset">やり直す</button></div>
  <div class="win" id="win"><div><strong>すべての点がつながった</strong><span id="winSub">完成した模様を眺めよう</span></div><button type="button" id="next">次の問題へ ›</button></div>
</section>
<p class="guide" id="guide">1本指で移動 · 2本指で大きさと角度を変える</p>
</main>
<script>

function toast(message){const e=$('toast');clearTimeout(toastTimeout);e.textContent=message;e.classList.add('show');toastTimeout=setTimeout(()=>e.classList.remove('show'),1000);}
// Single-voice sound design: one clear pitch at a time, no dissonant overlaps.
// Some mobile browsers pause AudioContext when the tab/app changes; every new touch tries to resume it.
function makeAudio(){
 if(!sound)return false;
 try{
  if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ctx=new C({latencyHint:'interactive'});master=ctx.createGain();master.gain.value=.58;master.connect(ctx.destination);}
  if(ctx.state!=='running'){
   if(!resumePromise){resumePromise=ctx.resume().then(()=>{
    resumePromise=null;
    if(waitingSound&&sound&&performance.now()-waitingSound.when<450){const event=waitingSound.type;waitingSound=null;playReadyAudio(event);}else waitingSound=null;
   }).catch(()=>{resumePromise=null;});}
   return false;
  }
  return true;
 }catch(_){return false;}
}
function playReadyAudio(type){
 if(!ctx||ctx.state!=='running'||!sound)return;
 const specs={shift:[523.25,.010,.023],grid:[523.25,.006,.014],found:[659.25,.055,.125],complete:[659.25,.067,.205]};
 const a=specs[type];if(!a)return;
 const t=ctx.currentTime;
 // Fade out the previous note before another starts. Never build chords during rapid gestures.
 if(activeVoice){try{const g=activeVoice.gain.gain;g.cancelScheduledValues(t);g.setTargetAtTime(.0001,t,.0028);}catch(_){}}
 try{
  const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(a[0],t);
  gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(a[1],t+.0045);
  gain.gain.exponentialRampToValueAtTime(.0001,t+a[2]);
  osc.connect(gain);gain.connect(master);osc.start(t);osc.stop(t+a[2]+.02);
  activeVoice={osc,gain};osc.onended=()=>{if(activeVoice?.osc===osc)activeVoice=null;osc.disconnect();gain.disconnect();};
 }catch(_){}
}
function audioEvent(type){
 if(!sound)return;
 const now=performance.now();
 if(type==='shift'){if(now-lastTick<90)return;lastTick=now;}
 if(makeAudio()){waitingSound=null;playReadyAudio(type);}
 else if(type==='found'||type==='complete')waitingSound={type,when:now};
}
window.addEventListener('pageshow',()=>{if(sound&&ctx&&ctx.state!=='running')makeAudio();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sound&&ctx&&ctx.state!=='running')makeAudio();});
function spawnFx(sq){
 fx.replaceChildren();clearTimeout(fxTimeout);if(motionOff)return;
 const {c}=sqShade(sq),p=asPoints(sq.points);
 // The line itself travels around the square. No white-on-white glow or scale-up of vertices.
 fx.append(node('polygon',{class:'trace',points:p,pathLength:100,stroke:c}),node('polygon',{class:'trace-sweep',points:p,pathLength:100}));
 for(const v of sq.points){const [x,y]=xy(v),d=5.7;fx.append(node('path',{class:'trace-corners',d:`M${(x-d).toFixed(2)} ${y.toFixed(2)}H${(x+d).toFixed(2)} M${x.toFixed(2)} ${(y-d).toFixed(2)}V${(y+d).toFixed(2)}`}));}
 fxTimeout=setTimeout(()=>fx.replaceChildren(),310);
}
function foundSquare(){if(stampHidden)return false;const snapped=snapCenter(center,shape),v=vertices(snapped,shape);if(dist(center,snapped)>.35||v.some(p=>!dots.has(key(p.x,p.y))))return false;const id=sqKey(v);if(found.has(id))return false;const sq=solutions.find(s=>s.id===id);if(!sq)return false;found.add(id);foundOrder.push(id);for(const p of sq.points){const k=key(p.x,p.y);used.set(k,(used.get(k)||0)+1);}center=snapped;snapLock=null;stampHidden=true;appendSquare(sq,true);spawnFx(sq);save();refreshDots();refreshHeader();rebuildPicker();audioEvent(win()?'complete':'found');if(win()){stageDone.add(lv);rebuildPicker();foundLayer.classList.remove('celebrate');void foundLayer.getBoundingClientRect();foundLayer.classList.add('celebrate');setTimeout(()=>foundLayer.classList.remove('celebrate'),1000);}requestDraw();return true;}
function changeShape(s){if(s.a===shape.a&&s.b===shape.b)return;shape=s;center=clampCenter(center,shape);snapLock=null;audioEvent('shift');requestDraw();}
function startSingle(){const [p]=pointers.values();single={p:{...p},c:{...center}};dual=null;}
function startDual(){const [a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};dual={mid,center:{...center},angle:Math.atan2(b.y-a.y,b.x-a.x),length:Math.max(.001,dist(a,b)),shape:{...shape}};single=null;}
function contactsChanged(){if(pointers.size>=2){if(!dual)startDual();const[a,b]=[...pointers.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},angle=Math.atan2(b.y-a.y,b.x-a.x),len=Math.hypot(dual.shape.a,dual.shape.b)*clamp(dist(a,b)/dual.length,.15,14),turn=Math.atan2(dual.shape.b,dual.shape.a)+angle-dual.angle;const next=nearestShape(len,turn);if(next.a!==shape.a||next.b!==shape.b)changeShape(next);center=clampCenter({x:dual.center.x+mid.x-dual.mid.x,y:dual.center.y+mid.y-dual.mid.y},shape);
 }else if(pointers.size===1&&single){const [p]=pointers.values();center=clampCenter({x:single.c.x+p.x-single.p.x,y:single.c.y+p.y-single.p.y},shape);}requestDraw();}
function inputStart(id,p){if(pointers.has(id)||win())return;makeAudio();if(!saved.prefs.gestureSeen){saved.prefs.gestureSeen=true;$('guide').hidden=true;persist();}if(stampHidden)stampHidden=false;pointers.set(id,p);if(pointers.size===1)startSingle();else if(pointers.size===2)startDual();requestDraw();}
function inputMove(items){let updated=false;for(const[id,p]of items)if(pointers.has(id)){pointers.set(id,p);updated=true;}if(updated)contactsChanged();}
function inputEnd(ids,cancel=false){let changed=false;for(const id of ids)changed=pointers.delete(id)||changed;if(!changed)return;if(pointers.size>=2)startDual();else if(pointers.size===1)startSingle();else{single=null;dual=null;const lock=magnetCenter();const eligible=!!snapLock&&dist(lock,snapCenter(center,shape))<.01;center=snapCenter(center,shape);snapLock=null;if(!cancel&&eligible)foundSquare();}requestDraw();}
function stopHint(){clearTimeout(hintTimeout);hintPoint=null;hintLayer.replaceChildren();}
function showHint(){if(win()){toast('この問題はクリア済み');return;}const rest=level.points.filter(p=>!exhausted(key(...p)));const singles=rest.filter(p=>degreeOf(key(...p))===1),pool=singles.length?singles:rest;if(!pool.length)return;const p=pool[(found.size+lv)%pool.length];stopHint();hintPoint=p;const[x,y]=xy({x:p[0],y:p[1]});hintLayer.append(node('circle',{cx:x,cy:y,r:17,class:'hint-ring'}));toast('この点を含む正方形を探そう');hintTimeout=setTimeout(stopHint,2900);}
function load(i,saveOld=true){if(lv>=0&&saveOld)save();cancelAnimationFrame(frame);frame=0;clearTimeout(fxTimeout);clearTimeout(toastTimeout);stopHint();fx.replaceChildren();foundLayer.classList.remove('celebrate');$('toast').classList.remove('show');pointers.clear();single=null;dual=null;snapLock=null;stampHidden=false;lastReticleLock=null;if(reticlePulse){reticlePulse.cancel();reticlePulse=null;}
 lv=(i+LEVELS.length)%LEVELS.length;level=LEVELS[lv];size();dots=new Set(level.points.map(p=>key(...p)));solutions=detect(level.points);degree=new Map(level.points.map(p=>[key(...p),0]));for(const q of solutions)for(const p of q.points){const k=key(p.x,p.y);degree.set(k,degreeOf(k)+1);}
 const ids=new Set(solutions.map(s=>s.id)),row=saved.boards[String(lv)]||[];foundOrder=Array.isArray(row)?[...new Set(row.filter(id=>ids.has(id)))]:[];found=new Set(foundOrder);used=new Map(level.points.map(p=>[key(...p),0]));for(const sq of solutions)if(found.has(sq.id))for(const p of sq.points){const k=key(p.x,p.y);used.set(k,(used.get(k)||0)+1);}
 if(win())stageDone.add(lv);else stageDone.delete(lv);
 shapes=allShapes(level.cols,level.rows);shape={a:3,b:0};center=snapCenter({x:(level.cols-1)/2,y:level.rows*.71},shape);snapLock=null;
 if(solutions.length!==level.expected||solutions.some(q=>!q.points.some(p=>degreeOf(key(p.x,p.y))<=2))||[...degree.values()].some(v=>v===0))console.error('Integrity error on level',lv+1);
 $('stageIdx').textContent=String(lv+1).padStart(2,'0');$('stageText').textContent=`${level.points.length} POINTS  ·  ${lv<10?'EXPLORER':lv<20?'DISCOVERY':'CHALLENGE'}`;
 drawGrid();drawDots();drawFound();rebuildPicker();refreshHeader();saved.idx=lv;persist();requestDraw();}
// Touch events are captured only inside the puzzle, preserving normal page scrolling outside.
const touchAvailable=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(touchAvailable){svg.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();for(const t of e.changedTouches)inputStart('t'+t.identifier,screenPoint(t));},{passive:false});svg.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();inputMove([...e.touches].map(t=>['t'+t.identifier,screenPoint(t)]));},{passive:false});svg.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();inputEnd([...e.changedTouches].map(t=>'t'+t.identifier));},{passive:false});svg.addEventListener('touchcancel',e=>{if(e.cancelable)e.preventDefault();inputEnd([...e.changedTouches].map(t=>'t'+t.identifier),true);},{passive:false});}
svg.addEventListener('pointerdown',e=>{if(touchAvailable&&e.pointerType==='touch')return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}inputStart('p'+e.pointerId,screenPoint(e));});svg.addEventListener('pointermove',e=>{if(pointers.has('p'+e.pointerId)){e.preventDefault();inputMove([['p'+e.pointerId,screenPoint(e)]])}});svg.addEventListener('pointerup',e=>{if(pointers.has('p'+e.pointerId)){e.preventDefault();inputEnd(['p'+e.pointerId])}});svg.addEventListener('pointercancel',e=>inputEnd(['p'+e.pointerId],true));svg.addEventListener('lostpointercapture',e=>inputEnd(['p'+e.pointerId],true));svg.addEventListener('contextmenu',e=>e.preventDefault());
for(const n of ['gesturestart','gesturechange','gestureend'])document.addEventListener(n,e=>{if($('wrap').contains(e.target)&&e.cancelable)e.preventDefault()},{passive:false});
svg.addEventListener('wheel',e=>{e.preventDefault();const ordered=[...shapes].sort((a,b)=>Math.hypot(a.a,a.b)-Math.hypot(b.a,b.b)||a.b-b.b),j=ordered.findIndex(s=>s.a===shape.a&&s.b===shape.b);changeShape(ordered[(j+(e.deltaY>0?1:-1)+ordered.length)%ordered.length]);center=snapCenter(center,shape);requestDraw();},{passive:false});
$('choose').addEventListener('click',()=>{const picker=$('picker');picker.hidden=!picker.hidden;$('choose').setAttribute('aria-expanded',String(!picker.hidden));});
$('stageGrid').addEventListener('click',e=>{const b=e.target.closest('button[data-stage]');if(!b)return;load(+b.dataset.stage);$('picker').hidden=true;$('choose').setAttribute('aria-expanded','false');});
$('prev').addEventListener('click',()=>load(lv-1));$('nextStage').addEventListener('click',()=>load(lv+1));$('next').addEventListener('click',()=>load(lv+1));
$('settings').addEventListener('click',()=>{const o=$('options');o.hidden=!o.hidden;$('settings').setAttribute('aria-expanded',String(!o.hidden));});
$('hint').addEventListener('click',showHint);
$('sound').addEventListener('click',()=>{sound=!sound;if(!sound){waitingSound=null;if(activeVoice&&ctx){try{activeVoice.gain.gain.setTargetAtTime(.0001,ctx.currentTime,.003)}catch(_){}}}saved.prefs.sound=sound;$('sound').textContent=sound?'音 ON':'音 OFF';$('sound').setAttribute('aria-pressed',String(sound));persist();if(sound)audioEvent('shift')});
$('motion').addEventListener('click',()=>{motionOff=!motionOff;saved.prefs.motion=motionOff;document.body.classList.toggle('low-motion',motionOff);$('motion').textContent=motionOff?'動き OFF':'動き ON';$('motion').setAttribute('aria-pressed',String(!motionOff));persist();requestDraw();});
$('reticleToggle').addEventListener('click',()=>{reticleEnabled=!reticleEnabled;saved.prefs.reticle=reticleEnabled;$('reticleToggle').textContent=reticleEnabled?'四隅 ON':'四隅 OFF';$('reticleToggle').setAttribute('aria-pressed',String(reticleEnabled));lastReticleLock=null;persist();requestDraw();});
$('reset').addEventListener('click',()=>{saved.boards[String(lv)]=[];stageDone.delete(lv);persist();load(lv,false);toast('最初から');$('options').hidden=true;$('settings').setAttribute('aria-expanded','false');});
window.__SQUARE_SNAP_TEST__={state:solveInfo,load,boards:LEVELS.length,magnet:()=>({lock:snapLock,center,shape,visible:magnetCenter()}),testSolve:()=>{for(const sq of solutions){if(found.has(sq.id))continue;const c={x:sq.points.reduce((a,p)=>a+p.x,0)/4,y:sq.points.reduce((a,p)=>a+p.y,0)/4},s=shapes.find(s=>sqKey(vertices(c,s))===sq.id);if(!s)throw Error('Square unreachable: '+sq.id);shape={...s};center=c;stampHidden=false;if(!foundSquare())throw Error('Square failed: '+sq.id);}return solveInfo();},setShape:(a,b)=>{const s=shapes.find(s=>s.a===a&&s.b===b);if(s){shape=s;center=snapCenter(center,s);requestDraw();}return !!s;},setCenter:(x,y)=>{center=clampCenter({x,y},shape);requestDraw();},getRenderStats:()=>({dotElements:dotsLayer.childElementCount,gridElements:scene.childElementCount,foundElements:foundLayer.childElementCount})};
load(Number.isInteger(saved.idx)?clamp(saved.idx,0,LEVELS.length-1):0);
})();
