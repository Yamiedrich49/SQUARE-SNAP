function computeSize(){step=Math.min(318/(level.cols-1),420/(level.rows-1));ox=(VW-step*(level.cols-1))/2;oy=(VH-step*(level.rows-1))/2;}

function animateFound(sq,color){fx.innerHTML='';const pts=asPoints(sq.points),c={x:sq.points.reduce((a,p)=>a+p.x,0)/4,y:sq.points.reduce((a,p)=>a+p.y,0)/4},[px,py]=xy(c);fx.innerHTML=`<polygon class="veil" points="${pts}" fill="${color}"/><polygon class="trace" points="${pts}" pathLength="100" stroke="${color}"/><circle class="ring" cx="${px}" cy="${py}" r="19" stroke="${color}"/>`;clearTimeout(fxTimer);fxTimer=setTimeout(()=>{fx.innerHTML='';lastFound=null;render();},610);}
function saveBoard(){if(lv<0)return;saved.boards[String(lv)]=[...found];saved.idx=lv;persist();}
function tryFind(){const v=verts(center,shape);if(v.some(p=>!Number.isInteger(p.x)||!Number.isInteger(p.y)||!dots.has(key(p.x,p.y))))return false;const id=sqKey(v);if(found.has(id))return false;const sq=solutions.find(s=>s.id===id);if(!sq)return false;found.add(id);for(const p of sq.points){const k=key(p.x,p.y);used.set(k,(used.get(k)||0)+1);}saveBoard();lastFound=id;stampHidden=true;const color=PALETTE[(found.size-1)%PALETTE.length];play('snap');if(navigator.vibrate)navigator.vibrate(12);animateFound(sq,color);if(isWon()){levelsSolved.add(lv);toast('すべての点を満たした！ ✦');}else{toast('ぴったり！ ✦');}updatePicker();el('score').classList.remove('bump');void el('score').offsetWidth;el('score').classList.add('bump');updateHeader();return true;}
function changeShape(s){if(shape.a!==s.a||shape.b!==s.b){shape=s;const now=performance.now();if(now-changeTick>80){play('shift');changeTick=now;}}}
// Move with one finger, or pinch/rotate anywhere on the board with two.
// Do not reposition the shape on touchstart: the first contact of a two-finger
// gesture must not make it jump before the second finger arrives.
function begin(p){

function dualBegin(){

function contactStart(k,p){

function contactMove(items){let did=false;for(const[k,p]of items)if(touch.has(k)){touch.set(k,p);did=true;}if(did)drag();}

function updatePicker(){el('stageGrid').innerHTML=LEVELS.map((b,j)=>{const rec=saved.boards[String(j)]||[],done=levelsSolved.has(j);return `<button type="button" class="stageBtn ${j===lv?'current':''} ${done?'done':rec.length?'partial':''}" data-level="${j}" aria-label="問題${j+1}${done?'クリア済み':''}">${String(j+1).padStart(2,'0')}</button>`;}).join('');}

function showHint(){if(isWon()){toast('この問題はクリア済み ✦');return;}const unfulfilled=level.points.filter(p=>!exhausted(key(...p)));if(!unfulfilled.length)return;const singles=unfulfilled.filter(p=>degree.get(key(...p))===1);const opts=singles.length?singles:unfulfilled;const p=opts[(found.size+lv)%opts.length];stopHint();hintPoint=p;render();toast('この点を使う正方形を探そう');hintTimer=setTimeout(()=>{hintPoint=null;render();},2700);}
const hasTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
