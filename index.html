<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f9f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SQUARE SNAP | 隠れた正方形</title>
<style>
:root{color-scheme:light;--ink:#1d3541;--sub:#6b838b;--cyan:#0a9da7;--line:#d6e6e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f6f9f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #6cc7ca;outline-offset:2px}
.shell{max-width:480px;margin:0 auto;padding:16px 13px max(18px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 3px 15px;min-height:32px}
.logo{display:flex;align-items:center;gap:9px;font-size:14px;letter-spacing:.13em;font-weight:850}
.mark{display:inline-block;width:16px;height:16px;border:2px solid #0ba1ab;border-radius:2px;transform:rotate(-18deg);box-shadow:4px -3px 0 -1px #f6f9f8,4px -3px 0 0 #9bdadd}
.submark{font-size:10px;font-weight:680;letter-spacing:.06em;color:#81989f}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.level{border:1px solid #dee9e9;background:#fff;padding:10px 4px 9px;border-radius:12px;color:#758e95;min-width:0;transition:background .14s,border-color .14s,transform .14s}
.level:active{transform:scale(.975)}
.level b{font-weight:850;font-size:13px;letter-spacing:.025em}
.level span{margin-left:5px;font-size:10px;font-weight:600}
.level.on{background:#e5f6f5;border-color:#6ec6c7;color:#047e88}
.paper{background:white;border:1px solid #dfeaea;border-radius:21px;box-shadow:0 16px 42px rgba(35,76,86,.055);overflow:hidden}
.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:16px 17px 8px}
.eyebrow{font-size:10px;letter-spacing:.11em;font-weight:820;color:#799099;margin-bottom:5px}
.heading h1{margin:0;font-weight:840;font-size:18px;letter-spacing:-.035em;line-height:1.35}
.count{white-space:nowrap;display:flex;align-items:baseline;gap:4px;line-height:1;font-variant-numeric:tabular-nums}
.count strong{font-size:35px;font-weight:850;color:var(--cyan);transition:transform .18s}
.count strong.bump{animation:bump .38s ease}
.count span{font-size:16px;font-weight:780;color:#9aafb5}
.count small{font-size:11px;color:#9aafb5}
.progress{display:flex;gap:4px;margin:8px 17px 12px}
.progress i{flex:1;height:3px;border-radius:4px;background:#e9f0f1;transition:background .3s}
.progress i.on{background:#0babb2}
.clue{display:flex;justify-content:space-between;align-items:center;gap:5px;margin:0 16px 11px;font-size:11px;color:#68818a;font-weight:600}
.clue-label{display:flex;align-items:center;gap:7px}
.demo{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:#178e9a;color:white;font-size:11px;font-weight:800}
.minibtn{border:0;background:transparent;color:#7c989f;padding:4px 5px;font-size:10px;font-weight:760;white-space:nowrap}
.minibtn[aria-pressed="true"]{color:#078b96}
.boardWrap{position:relative;margin:0 8px 0;border:1px solid #e6eeee;border-radius:14px;overflow:hidden;background:#fcfdfd;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.boardWrap svg{width:100%;aspect-ratio:360/482;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.boardWrap svg *{touch-action:none;user-select:none;-webkit-user-select:none}
.boardWrap svg:active{cursor:grabbing}
#input{pointer-events:all}
#toast{pointer-events:none;position:absolute;z-index:2;top:14px;left:50%;transform:translate(-50%,-6px);opacity:0;transition:opacity .14s,transform .16s;background:rgba(26,68,77,.93);border-radius:100px;padding:8px 17px;color:white;font-size:12px;font-weight:750;white-space:nowrap;box-shadow:0 8px 20px #204a5430}
#toast.show{opacity:1;transform:translate(-50%,0)}
.win{display:none;position:absolute;z-index:3;bottom:12px;left:12px;right:12px;padding:11px 12px;background:#ffffffee;border:1px solid #b3dedd;border-radius:14px;box-shadow:0 10px 40px #0d3e4e20;align-items:center;gap:10px;justify-content:space-between;backdrop-filter:blur(9px)}
.win.visible{display:flex}
.win strong{font-size:14px;color:#147f86}
.win small{display:block;margin-top:3px;font-size:10px;color:#7b9298}
.win button{border:0;border-radius:10px;background:#0b9aa5;color:white;font-size:12px;font-weight:760;padding:11px 13px;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px 13px}
.tip{margin:0;font-size:10.5px;font-weight:550;color:#7b9299;line-height:1.5}
.actions{display:flex;gap:5px;white-space:nowrap}
.action{border:1px solid #e1eaeb;background:#f8fbfb;color:#66828c;border-radius:9px;font-size:11px;font-weight:720;padding:9px 10px}
.action:active{transform:scale(.96)}
.below{text-align:center;color:#91a4aa;font-size:10px;font-weight:600;margin:12px 4px 0;line-height:1.7}
#fx .trace{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:trace .55s cubic-bezier(.22,.61,.25,1) forwards}
#fx .veil{opacity:0;animation:veil .52s ease-out forwards}
#fx .ring{fill:none;stroke-width:2.5;opacity:0;animation:ring .56s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes veil{0%{opacity:0}55%{opacity:0}100%{opacity:.12}}
@keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
@keyframes bump{0%{transform:scale(.85)}55%{transform:scale(1.17)}100%{transform:scale(1)}}
@media(max-width:360px){.shell{padding:11px 8px 14px}.top{margin-bottom:10px}.heading{padding:13px 12px 7px}.heading h1{font-size:16px}.clue{margin:0 12px 9px;font-size:10px}.boardWrap{margin:0 6px}.foot{padding:9px 11px 12px}.tip{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="logo"><span class="mark" aria-hidden="true"></span>SQUARE SNAP</div><span class="submark">HIDDEN SQUARES</span></header>
<nav class="levels" id="levels" aria-label="問題選択"></nav>
<section class="paper" aria-label="隠れた正方形パズル">
  <div class="heading"><div><div class="eyebrow" id="stageText">LEVEL 01</div><h1 id="goalText">正方形を5個見つけよう</h1></div><div class="count"><strong id="score">0</strong><span>/</span><span id="goalNum">5</span></div></div>
  <div class="progress" id="progress" aria-label="発見状況"></div>
  <div class="clue"><div class="clue-label"><span class="demo">2</span><span>数字は、その点に残る正方形の数</span></div><button type="button" class="minibtn" id="hints" aria-pressed="true">数字 ON</button></div>
  <div class="boardWrap" id="wrap">
    <svg id="board" viewBox="0 0 360 482" aria-label="指で正方形を移動・回転・拡大縮小して頂点を合わせるゲーム"><g id="scene" pointer-events="none"></g><g id="fx" pointer-events="none"></g><rect id="input" width="360" height="482" fill="transparent"/></svg>
    <div id="toast" aria-live="polite" role="status"></div>
    <div class="win" id="win"><div><strong>すべて発見！ ✦</strong><small>見えなかった形が、つながった。</small></div><button type="button" id="next">次の問題へ →</button></div>
  </div>
  <div class="foot"><p class="tip">指で動かす・角を引く<br>2本指で拡大・回転</p><div class="actions"><button id="sound" class="action" type="button" aria-pressed="true">♪ ON</button><button id="reset" class="action" type="button">↺ 最初から</button></div></div>
</section>
<p class="below">4つの角が点に重なると、正方形が姿を現します。</p>
</main>
<script>
(()=>{'use strict';
const LEVELS=[{"label":"みつける","cols":11,"rows":14,"points":[[0,1],[0,10],[1,5],[3,3],[3,4],[3,7],[3,13],[4,0],[4,11],[5,4],[5,5],[6,4],[6,7],[6,10],[8,13],[10,9]],"squares":5,"shapes":[[3,0],[2,2],[3,3],[4,2],[4,-1]]},{"label":"ひらめく","cols":14,"rows":17,"points":[[0,7],[2,9],[3,6],[4,2],[5,8],[5,10],[5,11],[5,16],[6,3],[6,7],[7,2],[9,6],[9,7],[9,8],[9,14],[10,0],[11,6],[11,10],[11,16],[13,4],[13,8],[13,10]],"squares":7,"shapes":[[6,0],[4,4],[6,2],[3,1],[2,2],[5,4],[4,-3]]},{"label":"たんきゅう","cols":16,"rows":19,"points":[[0,17],[1,7],[1,9],[1,13],[2,4],[3,7],[3,9],[4,18],[5,8],[5,9],[5,13],[5,14],[6,1],[6,16],[8,12],[9,2],[9,5],[9,13],[9,15],[12,2],[12,5],[12,10],[12,16],[13,7],[13,9],[14,4],[15,6],[15,13]],"squares":9,"shapes":[[4,0],[4,4],[4,-3],[4,1],[3,0],[3,-1],[3,3],[2,0],[2,-1]]}];
const VW=360,VH=482;
const el=id=>document.getElementById(id),svg=el('board'),scene=el('scene'),fx=el('fx');
const key=(x,y)=>`${x},${y}`;
const sqKey=ps=>ps.map(p=>key(p.x,p.y)).sort().join('|');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
let lv=0,level,solutions=[],dots=new Set(),found=new Set(),shape={a:2,b:0},center={x:3,y:3};
let step=24,ox=20,oy=22,hints=true,sound=true,audio=null,pointMap=new Map(),shapes=[];
let touch=new Map(),gesture=null,mode='move',offset={x:0,y:0},anchor=null,toastTimer=null,fxTimer=null,lastFound=null,changeTick=0,stampHidden=false;
const PALETTE=['#069da8','#e1a05b','#6b8cbd','#9a81c5','#61a59b','#da8293','#b5934c','#627fb0','#6d9d83'];
function computeSize(){step=Math.min(318/(level.cols-1),420/(level.rows-1));ox=(VW-step*(level.cols-1))/2;oy=(VH-step*(level.rows-1))/2;}
function xy(p){return [ox+p.x*step,oy+p.y*step]}
function verts(c,s){const {a,b}=s;return [{x:c.x+(-a+b)/2,y:c.y+(-a-b)/2},{x:c.x+(a+b)/2,y:c.y+(b-a)/2},{x:c.x+(a-b)/2,y:c.y+(a+b)/2},{x:c.x+(-a-b)/2,y:c.y+(a-b)/2}];}
function asPoints(v){return v.map(p=>xy(p).map(z=>z.toFixed(2)).join(',')).join(' ')}
function distance(p,q){return Math.hypot(p.x-q.x,p.y-q.y)}
function detect(points){const s=new Set(points.map(p=>key(...p))),out=new Map();for(const [x,y] of points)for(const [xx,yy] of points){if(x===xx&&y===yy)continue;const dx=xx-x,dy=yy-y;for(const k of [-1,1]){const bx=-k*dy,by=k*dx;const ps=[{x,y},{x:xx,y:yy},{x:xx+bx,y:yy+by},{x:x+bx,y:y+by}];if(ps.every(p=>s.has(key(p.x,p.y))))out.set(sqKey(ps),{id:sqKey(ps),points:ps});}}return [...out.values()];}
function snapCenter(c,s){const d=verts({x:0,y:0},s)[0];let x=Math.round(c.x+d.x)-d.x,y=Math.round(c.y+d.y)-d.y;let p=verts({x,y},s);const xs=p.map(p=>p.x),ys=p.map(p=>p.y);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);if(minX<0)x+=Math.ceil(-minX);if(maxX>level.cols-1)x-=Math.ceil(maxX-level.cols+1);if(minY<0)y+=Math.ceil(-minY);if(maxY>level.rows-1)y-=Math.ceil(maxY-level.rows+1);return{x,y};}
function boardPoint(e){const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*VW/r.width,sy=(e.clientY-r.top)*VH/r.height;return{x:(sx-ox)/step,y:(sy-oy)/step};}
function nearestShape(length,angle){const wrap=d=>Math.abs(((d+Math.PI/4)%(Math.PI/2)+(Math.PI/2))%(Math.PI/2)-Math.PI/4);let best=shape,bestScore=Infinity;const rate=s=>Math.pow(wrap(angle-Math.atan2(s.b,s.a))/.22,2)+Math.pow(Math.log(Math.max(length,.1)/Math.hypot(s.a,s.b))/.30,2);for(const s of shapes){const n=rate(s);if(n<bestScore){best=s;bestScore=n;}}return rate(shape)<bestScore+.22?shape:best;}
function nearestCorner(p,origin){let best=shape,min=Infinity;const rate=s=>{const v=verts({x:0,y:0},s);return distance(p,{x:origin.x+v[2].x-v[0].x,y:origin.y+v[2].y-v[0].y});};for(const s of shapes){const d=rate(s);if(d<min){best=s;min=d;}}return rate(shape)<min+.13?shape:best;}
function hitPolygon(p,v){let inside=false;for(let i=0,j=v.length-1;i<v.length;j=i++){const a=v[i],b=v[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)inside=!inside;}return inside;}
function play(kind){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(kind==='snap'?730:560,t);o.frequency.exponentialRampToValueAtTime(kind==='snap'?590:460,t+.055);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='snap'?.015:.007,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.085);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.09);}catch(_){}}
function toast(s){const t=el('toast');clearTimeout(toastTimer);t.textContent=s;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),950)}
function updateHeader(){el('score').textContent=found.size;el('goalNum').textContent=solutions.length;el('progress').innerHTML=solutions.map((s,i)=>`<i class="${i<found.size?'on':''}"></i>`).join('');const win=found.size===solutions.length;el('win').classList.toggle('visible',win);el('next').textContent=lv===LEVELS.length-1?'最初から遊ぶ →':'次の問題へ →'}
function render(){let out='';
 out+=`<rect x="0" y="0" width="360" height="482" fill="#fcfdfd"/>`;
 for(let i=0;i<level.cols;i++){let x=ox+i*step;out+=`<path d="M ${x.toFixed(2)} ${(oy-8).toFixed(2)} V ${(oy+step*(level.rows-1)+8).toFixed(2)}" stroke="${i%5===0?'#d8e5e8':'#e7eff0'}" stroke-width="${i%5===0?1.2:.85}"/>`}
 for(let j=0;j<level.rows;j++){let y=oy+j*step;out+=`<path d="M ${(ox-8).toFixed(2)} ${y.toFixed(2)} H ${(ox+step*(level.cols-1)+8).toFixed(2)}" stroke="${j%5===0?'#d8e5e8':'#e7eff0'}" stroke-width="${j%5===0?1.2:.85}"/>`}
 let fi=0;for(const sq of solutions){if(!found.has(sq.id))continue;const color=PALETTE[fi++%PALETTE.length];if(sq.id===lastFound)continue;out+=`<polygon points="${asPoints(sq.points)}" fill="${color}" fill-opacity=".085" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;}
 const v=verts(center,shape),s=snapCenter(center,shape),sv=verts(s,shape),dist=distance(center,s);
 const allMatched=sv.every(p=>pointMap.has(key(p.x,p.y))),ready=dist<.42&&allMatched&&!found.has(sqKey(sv));
 if(!stampHidden)out+=`<polygon points="${asPoints(v)}" fill="${ready?'#13c1bd':'#0aa4b0'}" fill-opacity="${ready?'.15':'.065'}" stroke="${ready?'#00a6a0':'#11a1ac'}" stroke-width="${ready?3:2.2}" stroke-linejoin="round" stroke-dasharray="${ready?'':'5 4'}"/>`;
 // All marked points have precisely the same diameter. Shared-point numbers live INSIDE the dots.
 for(const [x,y] of level.points){const k=key(x,y),n=solutions.reduce((acc,s)=>acc+(!found.has(s.id)&&s.points.some(p=>p.x===x&&p.y===y)?1:0),0),initial=pointMap.get(k);const [px,py]=xy({x,y});const shared=initial>1;
  let color=n===0?'#b4c5c9':shared&&hints?'#108e9b':'#2d4350';
  if(ready&&sv.some(p=>p.x===x&&p.y===y))color='#00a8a1';
  out+=`<circle cx="${px}" cy="${py}" r="7" fill="${color}" stroke="white" stroke-width="1.7"/>`;
  if(hints&&shared){out+=`<text x="${px}" y="${py+3.4}" text-anchor="middle" font-size="10.5" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,sans-serif" fill="#fff">${n}</text>`;}
 }
 // A single distinct round manipulation knob; not a grid-point or a shape selector.
 const handle=v[2],[hx,hy]=xy(handle);if(!stampHidden)out+=`<circle cx="${hx}" cy="${hy}" r="13" fill="#ffffffed" stroke="#069ca6" stroke-width="2.3"/>`;
 if(!stampHidden)out+=`<path d="M ${hx-5} ${hy+4} L ${hx+4} ${hy-5} M ${hx-2} ${hy-5} H ${hx+4} V ${hy+1}" stroke="#069ca6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
 scene.innerHTML=out;updateHeader();}
function animateFound(sq,color){fx.innerHTML='';const pts=asPoints(sq.points);const c={x:sq.points.reduce((a,p)=>a+p.x,0)/4,y:sq.points.reduce((a,p)=>a+p.y,0)/4},[px,py]=xy(c);
 fx.innerHTML=`<polygon class="veil" points="${pts}" fill="${color}"/><polygon class="trace" points="${pts}" pathLength="100" stroke="${color}"/><circle class="ring" cx="${px}" cy="${py}" r="19" stroke="${color}"/>`;
 clearTimeout(fxTimer);fxTimer=setTimeout(()=>{fx.innerHTML='';lastFound=null;render();},610);
}
function tryFind(){const v=verts(center,shape);if(v.some(p=>!Number.isInteger(p.x)||!Number.isInteger(p.y)||!dots.has(key(p.x,p.y))))return false;const id=sqKey(v);if(found.has(id))return false;const sq=solutions.find(s=>s.id===id);if(!sq)return false;found.add(id);lastFound=id;stampHidden=true;const color=PALETTE[(found.size-1)%PALETTE.length];play('snap');if(navigator.vibrate)navigator.vibrate(12);animateFound(sq,color);toast(found.size===solutions.length?'すべて見つけた！ ✦':'ぴったり！ ✦');el('score').classList.remove('bump');void el('score').offsetWidth;el('score').classList.add('bump');return true;}
function changeShape(s){if(shape.a!==s.a||shape.b!==s.b){shape=s;let now=performance.now();if(now-changeTick>80){play('shift');changeTick=now;}}}
function begin(p){const v=verts(center,shape);if(distance(p,v[2])<(24/step)){mode='corner';anchor={...v[0]};}
 else{mode='move';if(hitPolygon(p,v))offset={x:center.x-p.x,y:center.y-p.y};else{offset={x:0,y:0};center={x:p.x,y:p.y};}}}
function dualBegin(){const p=[...touch.values()];if(p.length<2)return;const a=p[0],b=p[1];gesture={mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},center:{...center},angle:Math.atan2(b.y-a.y,b.x-a.x),distance:Math.max(distance(a,b),.01),shape:{...shape}};mode='dual'}
function drag(){if(touch.size>=2){if(!gesture)dualBegin();const [a,b]=[...touch.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},ang=Math.atan2(b.y-a.y,b.x-a.x),len=Math.hypot(gesture.shape.a,gesture.shape.b)*clamp(distance(a,b)/gesture.distance,.35,3.5);changeShape(nearestShape(len,Math.atan2(gesture.shape.b,gesture.shape.a)+ang-gesture.angle));center={x:gesture.center.x+mid.x-gesture.mid.x,y:gesture.center.y+mid.y-gesture.mid.y};}
 else if(touch.size===1){const p=[...touch.values()][0];if(mode==='corner'&&anchor){changeShape(nearestCorner(p,anchor));const rel=verts({x:0,y:0},shape)[0];center={x:anchor.x-rel.x,y:anchor.y-rel.y};}
 else{center={x:p.x+offset.x,y:p.y+offset.y};}}
 render();}
function contactStart(k,p){if(touch.has(k))return;const wasHidden=stampHidden;if(wasHidden){stampHidden=false;center={x:p.x,y:p.y};}touch.set(k,p);if(touch.size===1){if(wasHidden){mode='move';offset={x:0,y:0};}else begin(p);}else if(touch.size===2)dualBegin();render()}
function contactMove(items){let did=false;for(const [k,p] of items)if(touch.has(k)){touch.set(k,p);did=true;}if(did)drag()}
function contactEnd(ids,cancel=false){let removed=false;for(const k of ids)removed=touch.delete(k)||removed;if(!removed)return;
 if(touch.size>=2)dualBegin();else if(touch.size===1){gesture=null;mode='move';const p=[...touch.values()][0];offset={x:center.x-p.x,y:center.y-p.y};render();}
 else{gesture=null;center=snapCenter(center,shape);if(!cancel)tryFind();render();}}
function load(i){clearTimeout(fxTimer);clearTimeout(toastTimer);el('toast').classList.remove('show');fx.innerHTML='';lastFound=null;stampHidden=false;lv=i;level=LEVELS[i];computeSize();dots=new Set(level.points.map(p=>key(...p)));solutions=detect(level.points);found.clear();pointMap=new Map(level.points.map(p=>[key(...p),0]));for(const sq of solutions)for(const p of sq.points)pointMap.set(key(p.x,p.y),pointMap.get(key(p.x,p.y))+1);
 shapes=level.shapes.map(([a,b])=>({a,b}));shapes.sort((s,t)=>Math.hypot(s.a,s.b)-Math.hypot(t.a,t.b));shape={...shapes[0]};center=snapCenter({x:(level.cols-1)/2,y:level.rows*.75},shape);touch.clear();gesture=null;
 el('stageText').textContent=`LEVEL 0${i+1}  ·  ${level.points.length} POINTS`;
 el('goalText').textContent=`正方形を${solutions.length}個見つけよう`;
 el('levels').innerHTML=LEVELS.map((l,j)=>`<button class="level ${j===i?'on':''}" data-level="${j}" type="button"><b>0${j+1}</b><span>${l.label}</span></button>`).join('');
 for(const b of el('levels').querySelectorAll('button'))b.addEventListener('click',()=>load(+b.dataset.level));
 if(solutions.length!==level.squares)console.error('Unexpected squares',i,solutions.length,level.squares);
 // Integrity check: each actual square must have a realizable stamp shape.
 for(const sq of solutions){const ps=sq.points;let valid=false;for(const s of shapes){const c={x:ps.reduce((a,p)=>a+p.x,0)/4,y:ps.reduce((a,p)=>a+p.y,0)/4};if(sqKey(verts(c,s))===sq.id){valid=true;break;}}if(!valid)console.error('Unreachable square',i,sq);}
 render();}
// Event handlers are confined to the board to preserve normal iPhone navigation elsewhere.
const hasTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(hasTouch){svg.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();for(const t of e.changedTouches)contactStart('t'+t.identifier,boardPoint(t));},{passive:false});
 svg.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();contactMove([...e.touches].map(t=>['t'+t.identifier,boardPoint(t)]));},{passive:false});
 svg.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();contactEnd([...e.changedTouches].map(t=>'t'+t.identifier));},{passive:false});
 svg.addEventListener('touchcancel',e=>{if(e.cancelable)e.preventDefault();contactEnd([...e.changedTouches].map(t=>'t'+t.identifier),true);},{passive:false});}
svg.addEventListener('pointerdown',e=>{if(hasTouch&&e.pointerType==='touch')return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId)}catch(_){}contactStart('p'+e.pointerId,boardPoint(e));});
svg.addEventListener('pointermove',e=>{if(touch.has('p'+e.pointerId)){e.preventDefault();contactMove([['p'+e.pointerId,boardPoint(e)]])}});
svg.addEventListener('pointerup',e=>{if(touch.has('p'+e.pointerId)){e.preventDefault();contactEnd(['p'+e.pointerId])}});
svg.addEventListener('pointercancel',e=>contactEnd(['p'+e.pointerId],true));
svg.addEventListener('lostpointercapture',e=>contactEnd(['p'+e.pointerId],true));
svg.addEventListener('contextmenu',e=>e.preventDefault());
for(const n of ['gesturestart','gesturechange','gestureend'])document.addEventListener(n,e=>{if(el('wrap').contains(e.target)&&e.cancelable)e.preventDefault()},{passive:false});
el('next').addEventListener('click',()=>load((lv+1)%LEVELS.length));
el('reset').addEventListener('click',()=>{load(lv);toast('もう一度')});
el('hints').addEventListener('click',()=>{hints=!hints;el('hints').setAttribute('aria-pressed',String(hints));el('hints').textContent=hints?'数字 ON':'数字 OFF';render()});
el('sound').addEventListener('click',()=>{sound=!sound;el('sound').setAttribute('aria-pressed',String(sound));el('sound').textContent=sound?'♪ ON':'♪ OFF';if(sound)play('shift')});
// Desktop fallback for quick verification: rotate/resize via wheel.
svg.addEventListener('wheel',e=>{e.preventDefault();let n=shapes.findIndex(s=>s.a===shape.a&&s.b===shape.b);n=(n+(e.deltaY>0?1:-1)+shapes.length)%shapes.length;changeShape(shapes[n]);center=snapCenter(center,shape);render()},{passive:false});
// Tiny deterministic diagnostics used solely for checking geometry / all reachable states.
window.__SQUARE_SNAP_TEST__={state:()=>({stage:lv,dots:level.points.length,target:solutions.length,found:found.size,stamp:{...shape},center:{...center},allReachable:solutions.every(sq=>shapes.some(s=>sqKey(verts({x:sq.points.reduce((a,p)=>a+p.x,0)/4,y:sq.points.reduce((a,p)=>a+p.y,0)/4},s))===sq.id))}),testSolve:()=>{for(const s of solutions){const c={x:s.points.reduce((a,p)=>a+p.x,0)/4,y:s.points.reduce((a,p)=>a+p.y,0)/4},sh=shapes.find(t=>sqKey(verts(c,t))===s.id);if(sh){shape={...sh};center=c;tryFind();lastFound=null;}}render();return found.size;},load};
load(0);
})();
</script>
